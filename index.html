<style>
:root{--bg:#fff8dc;--card:#fff;--lav:#ffe58a;--lav2:#fff1c2;--pink:#ffe0b2;--pink2:#f5a65b;--ink:#2b2410;--mute:#6b5a2e;--pri:#f5b800;--prih:#ffc933;--prid:#7a4f00;--fill:#e0a100;--navy:#3b2f0b;--line:#f0e2a8;--bad:#b3261e;--r:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--fill);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.shell{background:var(--shell);border:1px solid var(--line);border-radius:28px;padding:22px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{cursor:pointer;color:inherit;font:600 17px 'Fraunces',serif;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;margin:0 auto}
.tab{padding:8px 22px;border-radius:99px;font-weight:700;color:var(--mute)}
.tab.on{background:var(--pri);color:var(--ink)}
.sync{font-size:12.5px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nav h1{font:600 clamp(26px,4vw,38px)/1.1 'Fraunces',serif;margin:0 12px 0 0}
.nb{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}
.btn{background:var(--pri);color:var(--ink);border-radius:99px;padding:9px 18px;font-weight:700}
.btn:hover{background:var(--prih)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn.ghost{background:#fff;color:var(--prid);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--lav2)}
.btn.light{background:#fff;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1000px){.s3,.s4{grid-column:span 6}.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(max-width:680px){.top{gap:8px}.top .btn.sm{padding:6px 11px;font-size:12.5px}.top .logo{padding:6px 12px;font-size:15px}.top .sync{font-size:11.5px;padding:5px 9px}.s3,.s4{grid-column:span 12}.shell{padding:14px;border-radius:22px}.tabs{order:3;width:100%;justify-content:center}.tab{flex:1;text-align:center;padding:8px 6px}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.lav{background:var(--lav);border-color:transparent}
.card.navy{background:var(--navy);color:var(--navytx);border-color:transparent}
.card.pink{background:var(--pink);border-color:transparent}
.card h2{font:700 17px 'DM Sans';margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.muted{color:var(--mute)}.navy .muted{color:var(--navyt)}
.hello{grid-column:span 7;padding:6px 4px}
.hello h1{font:600 clamp(30px,4.6vw,46px)/1.1 'Fraunces',serif;margin:0 0 8px}
.nameinp{font:inherit;border:0;border-bottom:2px dashed var(--line2);background:transparent;color:var(--prid);width:6.5ch;min-width:3ch;padding:0}
.hello p{margin:0;color:var(--mute);max-width:46ch}
.tiles{grid-column:span 5;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile b{font:600 26px 'Fraunces',serif;line-height:1.1}
.tile span{font-size:12.5px;color:var(--mute)}
@media(max-width:1000px){.hello,.tiles{grid-column:span 12}}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--fill);border-radius:99px;transition:width .3s}
.rem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px;margin:7px 0;border:2px solid transparent}
.rem.due{border-color:var(--pink2)}
.rem.done .rl{text-decoration:line-through;color:var(--mute)}
.rl{flex:1;min-width:0;overflow-wrap:anywhere}
.tm{font-size:12px;background:var(--lav2);color:var(--prid);border-radius:99px;padding:3px 9px;white-space:nowrap;font-weight:700}
.rem.due .tm{background:var(--pink);color:var(--bad)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);background:#fff;color:transparent;font-size:15px;line-height:1;flex:none;display:grid;place-items:center}
.ck.on{background:var(--pri);border-color:var(--fill);color:var(--ink)}
.ck.sm{width:22px;height:22px;font-size:13px;border-radius:7px}
.in{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;min-width:0;width:100%;color:var(--ink)}
.navy .in{background:var(--navy2);border-color:var(--navy3);color:var(--navytx)}
textarea.in{resize:vertical;min-height:86px}
.addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addrow .in{flex:1 1 110px}
.x{width:28px;height:28px;border-radius:8px;color:var(--mute);font-size:15px;flex:none}
.x:hover{background:var(--pink);color:var(--bad)}
.wt{font:600 24px/1.15 'Fraunces',serif;margin:2px 0 10px}
.wl{margin:0 0 14px;padding-left:20px}.wl li{margin:4px 0}
.wrow{display:flex;gap:8px;flex-wrap:wrap}
.slot{background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.slot.cur{background:#fff;box-shadow:0 0 0 2px var(--pri)}
.sl{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.nowtag{font-size:11px;background:var(--pri);color:var(--ink);border-radius:99px;padding:1px 8px}
.mrow{display:flex;gap:6px}
.mb{flex:1;max-width:52px;height:42px;border-radius:12px;background:#fff;border:2px solid transparent;font-size:21px}
.slot:not(.cur) .mb{background:rgba(255,255,255,.85)}
.mb.on{border-color:var(--prid);background:var(--lav2)}
.in.note{margin-top:8px;font-size:13.5px}
.sum{font-size:14px;margin:6px 0 0}
.money .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;background:var(--lav2);color:var(--prid);border-radius:99px;padding:3px 10px;margin-top:4px}
.sal{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.sal .in{width:120px;font-weight:700}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.big b{font:600 44px/1 'Fraunces',serif;color:var(--prid)}
.big b.neg{color:var(--bad)}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--lav2)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:10px 0 12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:10px;height:10px;border-radius:3px;display:inline-block}
.bill{display:grid;grid-template-columns:26px minmax(0,1fr) 98px 40px 28px;gap:6px;align-items:center;margin:5px 0}
.bill.paid .in:not(.amt){text-decoration:line-through;color:var(--mute)}
.pc{font-size:12px;color:var(--mute);text-align:right}
.note-sample{background:var(--pink);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.th{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.th p{margin:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.th small{color:var(--mute);white-space:nowrap}
table.g{width:100%;border-collapse:collapse;font-size:13.5px}
.g th,.g td{text-align:center;padding:6px 3px}
.g th{font-weight:700;color:var(--mute);font-size:12px}
.g td:first-child,.g th:first-child{text-align:left}
.g .t{background:var(--lav2);border-radius:8px}
.hk{color:var(--prid);font-weight:700}.mi{color:var(--line2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .ch{display:block;margin:0;text-align:center;font-size:11px;color:var(--mute);font-style:normal}
.cc{aspect-ratio:1;border-radius:9px;background:var(--lav2);font-style:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1;position:relative;min-height:30px}
.cc small{position:absolute;top:2px;left:4px;font-size:9px;opacity:.75}
.cc.fut{background:transparent;border:1px dashed var(--line)}
.cc.tdy{outline:2px solid var(--prid)}
.hb{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0}
.hb .n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;height:9px;background:var(--lav2);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--fill)}
.hb .v{width:40px;text-align:right;color:var(--mute);font-size:12.5px}
.wd{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14)}
.wd:first-of-type{border-top:0}
.wd .dd{width:38px;font-weight:700;color:var(--navyt)}
.wd .tt{flex:1;min-width:0}
.wd .tt small{display:block;color:var(--navyt)}
.wd .st{font-size:13px}
.sec{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
.mgrid td{padding:4px 2px}
.mgrid .e{font-size:18px}
.card.gold{background:var(--pri);border-color:transparent;color:var(--ink)}
.gold .muted{color:var(--navy)}
.quote{font:500 clamp(20px,2.4vw,27px)/1.3 'Fraunces',serif;margin:6px 0 16px}
.clock{font:600 clamp(44px,6vw,64px)/1 'Fraunces',serif;letter-spacing:.02em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.pbar.dark{background:rgba(255,246,220,.2);margin-bottom:14px}
.pbar.dark i{background:var(--pri)}
.pre{padding:6px 14px;border-radius:99px;border:1px solid var(--navy3);font-weight:700;font-size:13.5px}
.pre.on{background:var(--pri);color:var(--ink);border-color:var(--pri)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.lock{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 26px;box-shadow:0 8px 30px rgba(120,90,0,.12);text-align:center}
.lock h1{font-size:26px;margin:0 0 4px}.lock p{margin:0 0 16px;color:var(--mute);font-size:14px}
.lock input{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:10px;background:var(--soft)}
.lock .row{display:flex;gap:8px;margin-top:4px}.lock .row .btn{flex:1}
.lock .msg{min-height:18px;font-size:13px;color:#b3261e;margin:2px 0 8px}.lock .msg.ok{color:#2e7d32}
.lkp{max-width:420px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.lkp h3{margin:0 0 4px;font-size:16px}.lkp p{margin:0 0 10px;font-size:13px;color:var(--mute)}
.lkp input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px;background:var(--soft)}
.lkp .row{display:flex;gap:8px;flex-wrap:wrap}.lkp .msg{min-height:16px;font-size:13px;color:#b3261e;margin:0 0 6px}.lkp .msg.ok{color:#2e7d32}

.wm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 30px;gap:8px 6px;align-items:center;justify-items:center;margin-top:12px}
.wm .h{font-size:12px;color:var(--navyt);font-weight:700}
.wm .d{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--navy2);color:var(--navyt);border:0;cursor:pointer;padding:0;font-family:inherit}
.wm .d.on{background:var(--pri);color:var(--ink);font-weight:800}
.wm .d.out{opacity:.3;cursor:default}.wm .d.fut{background:transparent;border:1px dashed var(--navy3);cursor:default}
.wm .d.tdy{outline:2px solid var(--navytx);outline-offset:1px}
.wm .k{width:24px;height:24px;border-radius:50%;border:2px solid var(--navy3);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}
.wm .k.half{border-color:var(--pri)}.wm .k.on{background:var(--pri);border-color:var(--pri)}
.wm .fl{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:var(--pri);line-height:1}
.wstats{display:flex;gap:26px;margin-top:6px}.wstats b{display:block;font-size:22px;color:#fff}.wstats span{font-size:12px;color:var(--navyt)}
.stack{display:flex;flex-direction:column;gap:16px}.stack>.card{flex:1}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swb{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:13px;text-align:left}
.swb i{width:22px;height:22px;border-radius:50%;flex:none}.swb.on{border-color:var(--ink)}
.robar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--navy);color:var(--navytx);border-radius:16px;padding:10px 16px;margin-bottom:14px;font-size:14px}
.robar .btn{background:var(--navytx);color:var(--navy)}
#app.ro button:disabled,#app.ro input:disabled,#app.ro textarea:disabled{cursor:default;opacity:1}
#app.ro.nomoney [data-money],#app.ro.nomoney .money,#app.ro.noth [data-th]{display:none}
.lkp label{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:2px 0 6px}.lkp label input{width:auto;margin:0}
</style>
</head>

function syncLabel(){return syncState==='signedout'?'Sign in to sync':syncState==='saved'?'✓ Synced to your Google account':syncState==='saving'?'Saving…':syncState==='error'?'⚠ Couldn’t sync, saved on this device':'Saved on this device'}

function save(){if(S.up){const t=key(new Date());S.up=S.up.filter(u=>u.d>=t)}
 if(READONLY)return;
 S.updated=Date.now();
 try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}
 if(!ref)return;
 setSync('saving');clearTimeout(timer);timer=setTimeout(push,700);
}
async function push(){
 if(!ref)return;
 if(writing){pending=true;return}
 writing=true;
 try{await ref.set({json:JSON.stringify(S),updated:S.updated});setSync('saved');shPush()}catch(e){setSync('error')}
 writing=false;
 if(pending){pending=false;push()}
}
function isPristine(){return !!S.fresh&&!S.thoughts.length&&!Object.keys(S.done||{}).length&&!Object.keys(S.mood||{}).length&&!Object.keys(S.wdone||{}).length&&!Object.keys(S.paid||{}).length}
function attach(r){
 return Promise.race([r.get(),new Promise(res=>setTimeout(()=>res(null),10000))]).then(snap=>{
  if(!snap){ref=null;setSync('error');return}
  ref=r;
  if(snap.exists){
   const d=snap.data()||{};
   if(d.json&&((d.updated||0)>(S.updated||0)||isPristine())){S=Object.assign(defaults(),JSON.parse(d.json));const mg=migrate();try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}if(mg)push()}
   else if((S.updated||0)>(d.updated||0)){push()}
  }else if(S.updated){push()}
  setSync(syncState==='saving'?'saving':'saved');
  render();
 });
}
async function initCloud(){
 try{
  if(typeof firebase==='undefined'||!FIREBASE_CONFIG.apiKey||/PASTE/.test(FIREBASE_CONFIG.apiKey)){setSync('local');return}
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH.enabled=true;AUTH.auth=firebase.auth();const fs=firebase.firestore();AUTH.fs=fs;
  AUTH.auth.getRedirectResult().catch(()=>{});
  AUTH.auth.onAuthStateChanged(u=>{
   AUTH.user=u;
   if(!u){ref=null;setSync('signedout');render();const m=/[#&]v=([^&]+)/.exec(location.hash||'');if(m&&!READONLY){try{vwOpen(decodeURIComponent(m[1]))}catch(_){}}return}
   attach(fs.collection('users').doc(u.uid).collection('data').doc('state')).catch(()=>{ref=null;setSync('error');render()});
  });
  setSync('signedout');render();
 }catch(e){ref=null;AUTH.enabled=false;setSync('local')}
}

function shSnap(){const sh=S.share||{};const c=JSON.parse(JSON.stringify(S));delete c.share;c.name=dispName();
 for(const d in (c.mood||{}))for(const k in c.mood[d])if(c.mood[d][k]&&typeof c.mood[d][k]==='object')delete c.mood[d][k].n;
 if(!sh.th)c.thoughts=[];
 if(!sh.money){c.bills=[];c.salary={'10':0,'25':0};c.paid={};c.sampleBills=false}
 c.hideMoney=!sh.money;c.hideTh=!sh.th;return c}

async function vwOpen(code){code=(code||'').trim();if(!code){SHNOTE='Type the code first.';render();return}
  if(!AUTH.fs){SHNOTE='Not available right now.';render();return}
  const h=await shHash(code);let first=true;
  if(UNSUB){try{UNSUB()}catch(_){}UNSUB=null}
  UNSUB=AUTH.fs.collection('shares').doc(h).onSnapshot(snap=>{
   if(!snap.exists){if(first){first=false;SHNOTE='That code didn’t work.';if(UNSUB){try{UNSUB()}catch(_){}UNSUB=null}render()}else vwExit('The owner stopped sharing.');return}
   try{const d=snap.data()||{};const ns=Object.assign(defaults(),JSON.parse(d.json));
    if(!READONLY){SAVEDS=S;READONLY=true;UI.date=mid(new Date());UI.view='day';SHP=false}
    S=ns;SHNOTE='';first=false;render()}catch(e){SHNOTE='Couldn’t open it.';render()}
  },err=>{SHNOTE=/permission/i.test((err&&err.code)||'')?'Sharing isn’t switched on yet.':'Couldn’t open it.';first=false;render()})}
function vwExit(note){if(UNSUB){try{UNSUB()}catch(_){}UNSUB=null}if(READONLY){READONLY=false;if(SAVEDS)S=SAVEDS;SAVEDS=null}SHNOTE=note||'';render()}

function ordn(n){return n%100>=11&&n%100<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th')}
function payDay(w){const v=Math.round(+((S.pay||{})[w]));return v>=1&&v<=31?v:+w}
function effDay(w,y,m0){return Math.min(payDay(w),new Date(y,m0+1,0).getDate())}
function periodFor(d){const day=d.getDate(),y=d.getFullYear(),m=d.getMonth();
 if(!single()&&day>=effDay('25',y,m))return[ymKey(d),'25'];
 if(day>=effDay('10',y,m))return[ymKey(d),'10'];
 const pd=new Date(y,m-1,1);return[ymKey(pd),single()?'10':'25']}
function nextPayday(){const t=mid(new Date());const day=t.getDate(),y=t.getFullYear(),m=t.getMonth();let d;
 const a=effDay('10',y,m),b=effDay('25',y,m);
 if(day<a)d=new Date(y,m,a,12);else if(!single()&&day<b)d=new Date(y,m,b,12);else d=new Date(y,m+1,effDay('10',y,m+1),12);return d}
function daysUntil(d){return Math.round((mid(d)-mid(new Date()))/864e5)}
function calc(ym,which){
 const sal=(single()&&which==='25')?0:(+S.salary[which]||0);
 const bills=single()?(which==='10'?S.bills:[]):S.bills.filter(b=>b.pay===which);
 const pm=S.paid[ym+'-'+which]||{};
 let total=0,paid=0;
 bills.forEach(b=>{const a=+b.a||0;total+=a;if(pm[b.id])paid+=a});
 const left=sal-total;
 return{sal,bills,pm,total,paid,unpaid:total-paid,left,pct:sal?left/sal*100:0,paidPct:sal?paid/sal*100:0}
}
function remStats(dk){const dn=S.done[dk]||{};const n=S.rems.length;const c=S.rems.filter(r=>dn[r.id]).length;return{n,c,p:n?c/n:0}}
function moodStats(dates){
 const st={n:0,sum:0,slot:{morning:{s:0,n:0},afternoon:{s:0,n:0},evening:{s:0,n:0}},days:[],dist:[0,0,0,0,0,0]};
 dates.forEach(dk=>{
  const m=S.mood[dk]||{};let s=0,n=0;
  SLOTS.forEach(([k])=>{const v=m[k]&&m[k].v;if(v){s+=v;n++;st.slot[k].s+=v;st.slot[k].n++;st.dist[v]++}});
  if(n){st.n+=n;st.sum+=s;st.days.push({dk,avg:s/n})}
 });
 st.avg=st.n?st.sum/st.n:0;
 return st;
}
function moodText(st,span){

 const out=['Average '+st.avg.toFixed(1)+' ('+mword(st.avg)+') over '+st.n+' check-in'+(st.n>1?'s':'')+'.'];
 const sl=SLOTS.map(([k,l])=>({l,a:st.slot[k].n?st.slot[k].s/st.slot[k].n:null})).filter(x=>x.a!==null).sort((a,b)=>b.a-a.a);
 if(sl.length>=2&&sl[0].a-sl[sl.length-1].a>=0.3)out.push(sl[0].l+' is your brightest ('+sl[0].a.toFixed(1)+'), '+sl[sl.length-1].l.toLowerCase()+' your lowest ('+sl[sl.length-1].a.toFixed(1)+').');
 else if(sl.length>=2)out.push('Pretty steady across the day.');
 if(span){
  const ds=[...st.days].sort((a,b)=>b.avg-a.avg);
  if(ds.length>=3){const f=x=>{const[y,m,d]=x.dk.split('-').map(Number);return DOW[new Date(y,m-1,d).getDay()]+' '+d};out.push('Best day: '+f(ds[0])+'. Toughest: '+f(ds[ds.length-1])+'.')}
  out.push('Logged on '+st.days.length+' of '+span+' days.');
 }
 return out.join(' ');
}

 if(people>=1)add(people*3,[people+' thought'+(people>1?'s':'')+' about other people. Free therapy for them, zero rent for you.','People appear in your head '+people+'x. You are the group chat’s unpaid therapist.']);

function calGrid(ym,fn){

 for(let d=1;d<=dim;d++)h+=fn(ym+'-'+pad(d),d);

 document.querySelectorAll('[data-keep]').forEach(e=>{if(keep[e.dataset.keep]!==undefined&&keep[e.dataset.keep]!==''||e.dataset.keep==='newRemT'&&keep.newRemT)e.value=keep[e.dataset.keep]});
 if(fk){const e=document.querySelector('[data-keep="'+fk+'"]');if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}

}


/* ---------- first-time welcome ---------- */
let VIEWGATE=false;
function welcomeScreen(){document.title='pbb-day';
 const had=document.getElementById('ob-name');const keep={};if(had)['ob-name','ob-cur','ob-pays','ob-p1','ob-p2','ob-s1','ob-s2'].forEach(i=>{const e=document.getElementById(i);if(e)keep[i]=e.value});
 const opt=(c)=>'<option value="'+esc(c)+'">'+esc(c)+'</option>';
 document.getElementById('app').innerHTML='<div class="lock" style="max-width:440px;text-align:left"><h1>Welcome</h1><p>A few quick questions to set this up for you. You can change everything later.</p>'

  +(AUTH.enabled?'<p style="margin:14px 0 4px;font-size:13px">Already use this? '+(AUTH.user?'':'<a href="#" data-a="signin" style="color:inherit;font-weight:600">Sign in with Google</a> to load your data. ')+'<a href="#" data-a="ob-view" style="color:inherit;font-weight:600">Have a code? View a shared dashboard</a></p>':'')+'</div>';
 for(const k in keep){const e=document.getElementById(k);if(e)e.value=keep[k]}
 if(!had){const e=document.getElementById('ob-name');if(e)try{e.focus()}catch(_){}}}
function obFinish(skip){
 const n=(id)=>{const e=document.getElementById(id);return e?e.value:''};
 const two=n('ob-pays')!=='1',num=v=>Math.max(0,parseFloat(v)||0),day=(v,d)=>{v=Math.round(parseFloat(v));return v>=1&&v<=31?v:d};
 if(!skip){const nm=n('ob-name').trim().slice(0,30);if(nm)S.name=nm;const c=n('ob-cur');S.cur=CURS.includes(c)?c:'₱';S.pays=two?2:1;
  let p1=day(n('ob-p1'),10),p2=day(n('ob-p2'),25);if(two&&p2<=p1)p2=Math.min(31,p1+1);if(two&&p1>=31)p1=30;S.pay={'10':p1,'25':p2};
  S.salary={'10':num(n('ob-s1')),'25':two?num(n('ob-s2')):0};
  const ex=!!(document.getElementById('ob-ex')||{}).checked;if(!ex){S.bills=[];S.paid={};S.sampleBills=false}else S.sampleBills=true}
 else{S.salary={'10':0,'25':0};S.bills=[];S.paid={};S.sampleBills=false}
 S.onb=true;S.fresh=true;commit()}
/* ---------- events ---------- */
function val(id){const e=document.getElementById(id)||document.querySelector('[data-keep="'+id+'"]');return e?e.value:''}
function addThought(){
 const x=val('thought').trim();if(!x)return;
 S.thoughts.push({id:uid(),x,ts:Date.now(),d:key(UI.date)});
 const e=document.getElementById('thought');if(e)e.value='';
 commit();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.tagName==='A')e.preventDefault();
 const a=t.dataset.a,id=t.dataset.id,p=t.dataset.p,dk=key(UI.date);
 if(READONLY&&!ROK.has(a))return;
 if(a==='ro-exit'){vwExit();return}
 if(a==='shmenu'){const open=SHP!=='share';closePanels();SHP=open?'share':false;SHLINK='';SHNOTE='';SHOK=false;
  if(open&&S.share&&S.share.h&&!S.share.code){(async()=>{const c2=genCode();const old=S.share.h;const h=await shHash(c2);S.share.h=h;S.share.code=c2;commit();await shDel(old);await shPush();SHNOTE='Here is your link. I made a fresh code, because the old one was not saved.';SHOK=true;render()})()}
  render();return}
 if(a==='vwmenu'){const open=SHP!=='view';closePanels();SHP=open?'view':false;SHNOTE='';render();return}
 if(a==='sh-save'){(async()=>{
  const code=val('sh-code').trim(),money=!!(document.getElementById('sh-money')||{}).checked,th=!!(document.getElementById('sh-th')||{}).checked;
  const had=S.share&&S.share.h;
  if(code&&code.length<6){SHNOTE='The code needs at least 6 characters.';SHOK=false;render();return}
  let c2=code||(S.share&&S.share.code)||'';
  if(!c2)c2=genCode();
  let h=had;if(code||!had){h=await shHash(c2);if(had&&had!==h)await shDel(had)}
  S.share={h,code:c2,money,th};commit();await shPush();
  SHNOTE=code||!had?'Sharing is on. Send friends the link below.':'Updated.';SHOK=true;render()})();return}
 if(a==='sh-copy'){const t=shLink()||SHLINK;try{navigator.clipboard.writeText(t).then(()=>{SHNOTE='Link copied.';render()},()=>{const e=document.getElementById('sh-link');if(e){e.select()}})}catch(_){const e=document.getElementById('sh-link');if(e)e.select()}return}
 if(a==='sh-stop'){SHLINK='';(async()=>{const h=S.share&&S.share.h;await shDel(h);delete S.share;commit();SHNOTE='Sharing stopped. The old code no longer works.';SHOK=true;render()})();return}
 if(a==='vw-open'){vwOpen(val('vw-code'));return}
 if(a==='ob-go'){obFinish(false);return}
 if(a==='ob-skip'){obFinish(true);return}
 if(a==='ob-view'){VIEWGATE=true;SHNOTE='';render();return}
 if(a==='gate-back'){VIEWGATE=false;SHNOTE='';render();return}
 if(a==='truthrr'){UI.truthN=(UI.truthN||0)+1;render();return}
 if(a==='exportTh'){if(!S.thoughts.length){BKNOTE='No thoughts to export yet.';BKNOTEOK=false;if(BKPANEL)render();return}dlFile('my-day-thoughts-'+stamp()+'.csv',thoughtsCsv(),'text/csv;charset=utf-8');BKNOTE='Exported '+S.thoughts.length+' thought'+(S.thoughts.length>1?'s':'')+' with date and time.';BKNOTEOK=true;if(BKPANEL)render();return}
 if(a==='bkdl'){dlFile('my-day-backup-'+stamp()+'.json',backupJson(),'application/json');BKNOTE='Backup downloaded.';BKNOTEOK=true;render();return}
 if(a==='bkmenu'){const o=!BKPANEL;closePanels();BKPANEL=o;BKNOTE='';BKPEND=null;render();return}
 if(a==='bkcancel'){BKPEND=null;BKNOTE='';render();return}
 if(a==='bkgo'){if(BKPEND){restoreApply(BKPEND);BKPEND=null;BKNOTE='Restored from your backup.';BKNOTEOK=true;render()}return}
 if(a==='mnmenu'){const o=!MNPANEL;closePanels();MNPANEL=o;render();return}
 if(a==='thmenu'){const o=!THPANEL;closePanels();THPANEL=o;render();return}
 if(a==='theme'){S.theme=t.dataset.t;commit();return}
 if(a==='refresh'){try{if(!LOCKED&&lkGet())sessionStorage.setItem('pbb-unl','1')}catch(_){}location.reload();return}
 if(a==='lk-open'){lkCheck($v('lk-pw')).then(ok=>{if(ok){LOCKED=false;render()}else{const m=document.getElementById('lk-msg');if(m)m.textContent='Wrong password.';const i=document.getElementById('lk-pw');if(i){i.value='';i.focus()}}});return}
 if(a==='lockmenu'){const o=!LKPANEL;closePanels();LKPANEL=o;LKNOTE='';LKOK=false;render();return}
 if(a==='lk-now'){if(lkGet()){LOCKED=true;LKPANEL=false;render()}return}
 if(a==='lk-save'||a==='lk-remove'){(async()=>{
  const has=!!lkGet();
  if(has&&!(await lkCheck($v('lkp-old')))){LKNOTE='Current password is wrong.';LKOK=false;render();return}
  if(a==='lk-remove'){try{localStorage.removeItem(LK)}catch(_){}LKNOTE='Password removed.';LKOK=true;render();return}
  const n=$v('lkp-new').trim();
  if(n.length<4){LKNOTE='Use at least 4 characters.';LKOK=false;render();return}
  if(n!==$v('lkp-new2').trim()){LKNOTE='The two passwords don’t match.';LKOK=false;render();return}
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{localStorage.setItem(LK,JSON.stringify({s:salt,h:await lkHash(n,salt)}))}catch(_){LKNOTE='Couldn’t save on this device.';LKOK=false;render();return}
  LKNOTE='Password saved. It will be asked next time you open the page.';LKOK=true;render()})();return}
 if(a==='signin'&&AUTH.auth){const p=new firebase.auth.GoogleAuthProvider();AUTH.auth.signInWithPopup(p).catch(e=>{if(e&&/popup|operation-not-supported/.test(e.code||''))AUTH.auth.signInWithRedirect(p)});return}
 if(a==='signout'&&AUTH.auth){AUTH.auth.signOut().then(()=>{try{localStorage.removeItem(STORE)}catch(_){}S=defaults();migrate();ref=null;render()});return}
 if(a==='view'){UI.view=t.dataset.v;UI.editW=null;try{history.replaceState(null,'','#'+UI.view)}catch(_){}render();return}
 if(a==='nav'){const n=+t.dataset.n;if(n===0)UI.date=mid(new Date());else if(UI.view==='day')UI.date=addDays(UI.date,n);else if(UI.view==='week')UI.date=addDays(UI.date,7*n);else UI.date=new Date(UI.date.getFullYear(),UI.date.getMonth()+n,1,12);render();return}
 if(a==='rem'){const d=S.done[dk]=S.done[dk]||{};d[id]=!d[id];if(!d[id])delete d[id];commit();return}
 if(a==='editRem'){UI.editRem=!UI.editRem;render();return}
 if(a==='delUp'){S.up=(S.up||[]).filter(u=>u.id!==id);commit();return}
 if(a==='addUp'){const l=val('newUp').trim(),d=val('newUpD');if(!l||!d||d<key(new Date()))return;(S.up=S.up||[]).push({id:uid(),d,l});commit();return}
 if(a==='delRem'){S.rems=S.rems.filter(r=>r.id!==id);commit();return}
 if(a==='addRem'){const l=val('newRem').trim();if(!l)return;S.rems.push({id:uid(),t:val('newRemT')||'09:00',l});const f=document.querySelector('[data-keep="newRem"]');if(f)f.value='';commit();return}
 if(a==='paid'){const k=t.dataset.ym+'-'+p;const m=S.paid[k]=S.paid[k]||{};m[id]=!m[id];if(!m[id])delete m[id];commit();return}
 if(a==='delBill'){S.bills=S.bills.filter(b=>b.id!==id);S.sampleBills=false;commit();return}
 if(a==='addBill'){const n=val('nb-'+p).trim();const am=parseFloat(val('na-'+p));if(!n)return;S.bills.push({id:uid(),n,a:isNaN(am)?0:Math.max(0,am),pay:p});S.sampleBills=false;['nb-','na-'].forEach(x=>{const f=document.querySelector('[data-keep="'+x+p+'"]');if(f)f.value=''});commit();return}
 if(a==='clearBills'){S.bills=[];S.paid={};S.sampleBills=false;commit();return}
 if(a==='mood'){const s=t.dataset.s,v=+t.dataset.v;const m=S.mood[dk]=S.mood[dk]||{};if(m[s]&&m[s].v===v){delete m[s]}else m[s]=Object.assign({},m[s],{v});commit();return}
 if(a==='quote'){UI.qOff++;render();return}
 if(a==='tpre'){const T=UI.timer;if(!T.running){T.mins=+t.dataset.m;T.left=T.mins*60;T.done=false;render()}return}
 if(a==='tgo'){const T=UI.timer;if(T.running){tick();if(T.running){T.running=false;T.end=null}}else{if(T.done||T.left<=0){T.left=T.mins*60}T.done=false;T.end=Date.now()+T.left*1000;T.running=true}render();return}
 if(a==='treset'){const T=UI.timer;T.running=false;T.end=null;T.done=false;T.left=T.mins*60;render();return}
 if(a==='wtog'){const k=t.dataset.k;if(S.wdone[k])delete S.wdone[k];else S.wdone[k]=true;commit();return}
 if(a==='wdone'){if(S.wdone[dk])delete S.wdone[dk];else S.wdone[dk]=true;commit();return}
 if(a==='editW'){UI.editW=t.dataset.d===''?null:+t.dataset.d;render();return}
 if(a==='saveW'){const d=+t.dataset.d;S.workouts[d]={title:val('wT').trim()||'Workout',ex:val('wE')};UI.editW=null;commit();return}
 if(a==='addThought'){addThought();return}
 if(a==='delThought'){S.thoughts=S.thoughts.filter(x=>x.id!==id);commit();return}
});
document.addEventListener('change',e=>{
 const t=e.target.closest('[data-c]');if(!t)return;
 const c=t.dataset.c,id=t.dataset.id,dk=key(UI.date);
 if(c==='bkfile'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=restoreParse(String(r.result));if(d){BKPEND=d;BKNOTE='';BKNOTEOK=false}else{BKPEND=null;BKNOTE='That file is not a My Day backup.';BKNOTEOK=false}render()};r.onerror=()=>{BKNOTE='Could not read that file.';render()};r.readAsText(f);return}
 if(c==='name'){S.name=t.value.trim().slice(0,30);commit();return}
 if(c==='remL'){const r=S.rems.find(r=>r.id===id);if(r&&t.value.trim()){r.l=t.value.trim();save()}return}
 if(c==='remT'){const r=S.rems.find(r=>r.id===id);if(r&&t.value){r.t=t.value;commit()}return}
 if(c==='payday'){const w=t.dataset.p;let v=Math.round(parseFloat(t.value));if(w==='25'&&(v===0||t.value.trim()==='')){S.pays=1;commit();return}if(!(v>=1))v=+w;v=Math.min(31,Math.max(1,v));S.pay=Object.assign({'10':10,'25':25},S.pay||{});if(!single()){if(w==='10'&&v>=payDay('25'))v=payDay('25')-1;if(w==='25'&&v<=payDay('10'))v=payDay('10')+1}S.pay[w]=Math.max(1,v);commit();return}
 if(c==='cur'){const v=t.value.trim().slice(0,4);S.cur=v||'₱';commit();return}
 if(c==='pays'){S.pays=+t.value===1?1:2;commit();return}
 if(c==='sal'){S.salary[t.dataset.p]=Math.max(0,parseFloat(t.value)||0);commit();return}
 if(c==='bn'){const b=S.bills.find(b=>b.id===id);if(b){b.n=t.value.trim()||b.n;S.sampleBills=false;commit()}return}
 if(c==='ba'){const b=S.bills.find(b=>b.id===id);if(b){b.a=Math.max(0,parseFloat(t.value)||0);S.sampleBills=false;commit()}return}
 if(c==='mnote'){const m=S.mood[dk];if(m&&m[t.dataset.s]){m[t.dataset.s].n=t.value.trim();save()}return}
});

 if(e.target.id==='thought'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addThought()}

{const h=location.hash.slice(1);if(['day','week','month'].includes(h))UI.view=h}
render();
